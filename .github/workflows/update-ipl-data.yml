name: Update IPL Data

on:
  schedule:
    - cron: '31 18 * * *'   # 12:01 AM IST
    - cron: '30 1 * * *'    # 7:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and update IPL data
        env:
          CRICAPI_KEY: ${{ secrets.CRICAPI_KEY }}
        run: node scripts/update-data.mjs

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet src/utils/iplData.js || echo "changed=true" >> $GITHUB_OUTPUT

      # - name: Commit and push changes
      #   if: steps.git-check.outputs.changed == 'true'
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git pull origin main --rebase
      #     git add src/utils/iplData.js
      #     git commit -m "chore: update IPL standings and matches [auto]"
      #     git push origin main


      -   name: Commit and push changes
          if: steps.git-check.outputs.changed == 'true'
          env:
            CRICAPI_KEY: ${{ secrets.CRICAPI_KEY }}

          run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
        
            git reset --hard HEAD
            git pull origin main --rebase
        
            node scripts/update-data.mjs
        
            git add src/utils/iplData.js
            git commit -m "chore: update IPL standings and matches [auto]"
        
            git push origin main

      - name: No changes detected
        if: steps.git-check.outputs.changed != 'true'
        run: echo "IPL data is already up to date. No changes needed."
